services:
  - type: web
    name: edupredict-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edupredict-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: edupredict-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://edupredict-web.onrender.com
      - key: DEBUG
        value: "False"

databases:
  - name: edupredict-db
    plan: free
    databaseName: edupredict
    user: edupredict

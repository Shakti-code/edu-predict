name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edupredict
          POSTGRES_USER: edupredict
          POSTGRES_PASSWORD: edupredict_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run System Checks and Tests
      env:
        SECRET_KEY: ci-test-secret-key-do-not-use-in-production
        DEBUG: True
        DATABASE_URL: postgres://edupredict:edupredict_secret@localhost:5432/edupredict
      run: |
        python manage.py check
        python manage.py migrate
        # Run Django tests
        python manage.py test
